[build]
  command = "npm run build --workspace=cms"
  publish = "apps/cms/.next"
  # Optional: only deploy if a tag 'v*' is present (like Machi 26)
  # ignore = "git fetch --tags --quiet && ! git tag --points-at HEAD | grep -q '^v'"

[build.environment]
  NODE_VERSION = "20"
  NEXT_USE_NETLIFY_EDGE = "true"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"
