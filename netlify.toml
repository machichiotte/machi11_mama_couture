[build]
  command = "pnpm --filter cms build"
  publish = "apps/cms/.next"
  # Désactivation du scanner de secrets qui bloque sur des faux positifs (Next.js/Payload)
  secrets_scan_enabled = false

[build.environment]
  # Forcer la désactivation au cas où
  SECRETS_SCAN_ENABLED = "false"
  # Omission des dossiers de build pour le scan
  SECRETS_SCAN_OMIT_PATHS = "apps/cms/.next/**, .netlify/**, apps/cms/public/**"
  # PNPM configuration
  PNPM_FLAGS = "--filter cms"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[plugins]]
  package = "@netlify/plugin-nextjs"
