services:
  mongodb:
    extends:
      file: docker-compose.yml
      service: mongodb
    container_name: machi11_mongo_dev
    ports:
      - "${DB_PORT:-27011}:27017"
    volumes:
      - mongodb_data_dev:/data/db
    restart: unless-stopped

  cms:
    extends:
      file: docker-compose.yml
      service: cms
    container_name: machi11_cms_dev
    env_file:
      - ./apps/cms/.env.development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/cms/node_modules
      - /app/apps/cms/.next
    working_dir: /app/apps/cms
    command: pnpm dev
    restart: "no"

networks:
  machi11-network:
    driver: bridge

volumes:
  mongodb_data_dev:
